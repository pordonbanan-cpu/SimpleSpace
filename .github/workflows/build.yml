name: Build Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack sources
        run: |
          unzip -o "SimpleSpace-mod-source (1).zip"
          if [ -d SimpleSpace ]; then
            cp -r SimpleSpace/* .
            cp -r SimpleSpace/.[!.]* . 2>/dev/null || true
          fi
          chmod +x gradlew || true

      - name: Apply GeckoLib build.gradle and TARS
        run: |
          cp fixes/build.gradle.geckolib build.gradle
          cp fixes/neoforge.mods.toml src/main/resources/META-INF/neoforge.mods.toml

          mkdir -p src/main/java/com/simplespace/tars
          mkdir -p src/main/java/com/simplespace/client
          mkdir -p src/main/java/com/simplespace/command
          mkdir -p src/main/java/com/simplespace/entity
          mkdir -p src/main/java/com/simplespace/event
          mkdir -p src/main/java/com/simplespace/dimension
          mkdir -p src/main/java/com/simplespace/item
          mkdir -p src/main/java/com/simplespace/block
          mkdir -p src/main/java/com/simplespace/space

          cp fixes/VirtualOrbitSystem.java src/main/java/com/simplespace/space/
          cp fixes/SpacePhysicsHandler.java src/main/java/com/simplespace/event/ 2>/dev/null || true
          cp fixes/SpacePlanetSpawner.java src/main/java/com/simplespace/event/ 2>/dev/null || true
          cp fixes/SpaceTransitionHandler.java src/main/java/com/simplespace/event/ 2>/dev/null || true
          cp fixes/TarsChatHandler.java src/main/java/com/simplespace/event/
          cp fixes/ModDimensions.java src/main/java/com/simplespace/dimension/ 2>/dev/null || true
          cp fixes/CelestialBodyRenderer.java src/main/java/com/simplespace/client/ 2>/dev/null || true
          cp fixes/SpaceDimensionEffects.java src/main/java/com/simplespace/client/ 2>/dev/null || true
          cp fixes/SpaceSkyRenderer.java src/main/java/com/simplespace/client/ 2>/dev/null || true
          cp fixes/ModEntities.java src/main/java/com/simplespace/entity/ 2>/dev/null || true
          cp fixes/SimpleSpace.java src/main/java/com/simplespace/
          cp fixes/ModItems.java src/main/java/com/simplespace/item/
          cp fixes/ModBlocks.java src/main/java/com/simplespace/block/
          cp fixes/TarsDockBlock.java src/main/java/com/simplespace/block/
          cp fixes/TarsCoreItem.java src/main/java/com/simplespace/item/
          cp fixes/TarsManualItem.java src/main/java/com/simplespace/item/
          cp fixes/SpaceCommands.java src/main/java/com/simplespace/command/ 2>/dev/null || true
          cp fixes/ClientModEvents.java src/main/java/com/simplespace/client/

          git show a1afa4f37ac0affad4a22c3124ad659d596fdc93:fixes/TarsEntity.java > src/main/java/com/simplespace/tars/TarsEntity.java
          python3 fixes/patch_warehouse.py src/main/java/com/simplespace/tars/TarsEntity.java
          python3 fixes/patch_tars_features.py src/main/java/com/simplespace/tars/TarsEntity.java
          python3 fixes/patch_dock_create.py src/main/java/com/simplespace/tars/TarsEntity.java

          cp fixes/TarsFollowOwnerGoal.java src/main/java/com/simplespace/tars/
          cp fixes/TarsGoToGoal.java src/main/java/com/simplespace/tars/
          cp fixes/TarsMineGoal.java src/main/java/com/simplespace/tars/
          cp fixes/TarsDockGoal.java src/main/java/com/simplespace/tars/
          cp fixes/TarsCreateBridge.java src/main/java/com/simplespace/tars/
          cp fixes/TarsCommands.java src/main/java/com/simplespace/command/
          cp fixes/TarsMenuScreen.java src/main/java/com/simplespace/client/
          cp fixes/TarsFlashScreen.java src/main/java/com/simplespace/client/
          cp fixes/TarsMineScreen.java src/main/java/com/simplespace/client/
          cp fixes/TarsGeoModel.java src/main/java/com/simplespace/client/
          cp fixes/TarsGeoRenderer.java src/main/java/com/simplespace/client/

          mkdir -p src/main/resources/assets/simplespace/geo/entity
          mkdir -p src/main/resources/assets/simplespace/animations/entity
          mkdir -p src/main/resources/assets/simplespace/textures/entity
          mkdir -p src/main/resources/assets/simplespace/textures/item
          mkdir -p src/main/resources/assets/simplespace/models/item
          mkdir -p src/main/resources/assets/simplespace/lang
          mkdir -p src/main/resources/data/simplespace/recipe
          cp fixes/tars.geo.json src/main/resources/assets/simplespace/geo/entity/
          cp fixes/tars.animation.json src/main/resources/assets/simplespace/animations/entity/
          cp fixes/recipes/*.json src/main/resources/data/simplespace/recipe/

          mkdir -p src/main/resources/assets/simplespace/blockstates
          mkdir -p src/main/resources/assets/simplespace/models/block
          printf '%s\n' '{' '  "variants": {' '    "": { "model": "simplespace:block/tars_dock" }' '  }' '}' > src/main/resources/assets/simplespace/blockstates/tars_dock.json
          cp fixes/models/tars_dock_block.json src/main/resources/assets/simplespace/models/block/tars_dock.json
          printf '%s\n' '{' '  "parent": "simplespace:block/tars_dock"' '}' > src/main/resources/assets/simplespace/models/item/tars_dock.json

          mkdir -p src/main/resources/data/sable/tags/entity_type
          cp fixes/data/sable/tags/entity_type/retain_in_sub_level.json src/main/resources/data/sable/tags/entity_type/

          python3 -c "import base64,pathlib; pathlib.Path('src/main/resources/assets/simplespace/textures/entity/tars.png').write_bytes(base64.b64decode(pathlib.Path('fixes/tars.png.b64').read_text().strip()))"

          for id in flash_l1 flash_l2 flash_l3 flash_l4 flash_l5 tars_core tars_dock tars_manual; do
            printf '%s\n' "{" "  \"parent\": \"minecraft:item/generated\"," "  \"textures\": { \"layer0\": \"simplespace:item/${id}\" }" "}" > "src/main/resources/assets/simplespace/models/item/${id}.json"
          done
          printf '%s\n' '{' '  "parent": "simplespace:block/tars_dock"' '}' > src/main/resources/assets/simplespace/models/item/tars_dock.json
          printf '%s\n' '{' '  "item.simplespace.tars_core": "Монолит TARS",' '  "item.simplespace.flash_l1": "Флешка TARS L1 (Сканер)",' '  "item.simplespace.flash_l2": "Флешка TARS L2 (Добыча)",' '  "item.simplespace.flash_l3": "Флешка TARS L3 (Добыча+)",' '  "item.simplespace.flash_l4": "Флешка TARS L4 (Сканер+)",' '  "item.simplespace.flash_l5": "Флешка TARS L5 (Броня)",' '  "item.simplespace.tars_dock": "Порт TARS",' '  "block.simplespace.tars_dock": "Порт TARS",' '  "item.simplespace.tars_manual": "Пособие TARS"' '}' > src/main/resources/assets/simplespace/lang/ru_ru.json
          printf '%s\n' '{' '  "item.simplespace.tars_core": "TARS Monolith",' '  "item.simplespace.flash_l1": "TARS Flash L1",' '  "item.simplespace.flash_l2": "TARS Flash L2",' '  "item.simplespace.flash_l3": "TARS Flash L3",' '  "item.simplespace.flash_l4": "TARS Flash L4",' '  "item.simplespace.flash_l5": "TARS Flash L5",' '  "item.simplespace.tars_dock": "TARS Port",' '  "block.simplespace.tars_dock": "TARS Port",' '  "item.simplespace.tars_manual": "TARS Manual"' '}' > src/main/resources/assets/simplespace/lang/en_us.json

          mkdir -p src/main/resources/data/simplespace/dimension_type
          mkdir -p src/main/resources/data/simplespace/dimension
          mkdir -p src/main/resources/data/simplespace/worldgen/biome
          cp fixes/space.json src/main/resources/data/simplespace/dimension_type/ 2>/dev/null || true
          cp fixes/moon_type.json src/main/resources/data/simplespace/dimension_type/moon.json 2>/dev/null || true
          cp fixes/moon_dim.json src/main/resources/data/simplespace/dimension/moon.json 2>/dev/null || true
          cp fixes/moon_wastes.json src/main/resources/data/simplespace/worldgen/biome/moon_wastes.json 2>/dev/null || true

      - name: Generate textures
        run: |
          python3 << 'PY'
          from pathlib import Path
          import struct, zlib, math

          def write_png(path, w, h, rgba_func):
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  for x in range(w):
                      r,g,b,a = rgba_func(x, y, w, h)
                      raw += bytes([r,g,b,a])
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)
              data = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(bytes(raw), 9)) + chunk(b'IEND', b'')
              Path(path).write_bytes(data)

          out = Path('src/main/resources/assets/simplespace/textures/entity')
          out.mkdir(parents=True, exist_ok=True)
          SIZE = 128

          # Full-square textures for cube planet faces (no circular mask)
          def sun(x,y,w,h):
              u, v = x/(w-1), y/(h-1)
              heat = 0.7 + 0.3 * math.sin(u*9) * math.cos(v*7)
              n = ((x*17) ^ (y*31) ^ ((x//4)*(y//4))) & 255
              spark = 40 if n > 240 else 0
              return min(255, int(255*heat)+spark), min(255, int(180+60*heat)+spark//2), int(40+50*heat), 255

          def earth(x,y,w,h):
              u, v = x/(w-1), y/(h-1)
              hsh = ((x*13) ^ (y*7) ^ ((x//6)*(y//6)*19)) & 255
              if v < 0.12 or v > 0.88:
                  r,g,b = 235, 235, 245
              elif hsh > 150:
                  r,g,b = 45+hsh//12, 120+hsh//10, 40
              else:
                  r,g,b = 20, 70+hsh//14, 165+hsh//12
              if ((int(u*32)+int(v*8)) % 7) == 0 and hsh > 100:
                  r,g,b = min(255,r+40), min(255,g+40), min(255,b+40)
              shade = 0.75 + 0.25 * math.sin(u*math.pi)
              return int(r*shade), int(g*shade), int(b*shade), 255

          def moon(x,y,w,h):
              hsh = ((x*11) ^ (y*13) ^ ((x//5)*(y//5)*23)) & 255
              base = 140 + (hsh % 45)
              for cx,cy,cr in [(30,40,12),(90,70,18),(50,100,10),(100,30,8)]:
                  d = math.sqrt((x-cx)**2 + (y-cy)**2)
                  if d < cr:
                      base = int(base * (0.55 + 0.45*d/cr))
              c = max(40, min(220, base))
              return c, c, min(255, c+10), 255

          write_png(out/'sun.png', SIZE, SIZE, sun)
          write_png(out/'earth.png', SIZE, SIZE, earth)
          write_png(out/'moon.png', SIZE, SIZE, moon)

          sky = Path('src/main/resources/assets/simplespace/textures/sky')
          sky.mkdir(parents=True, exist_ok=True)

          def milky(x, y, w, h):
              v = y / (h - 1)
              dist = abs(v - 0.5) * 2
              base = max(0, 1 - dist ** 1.2)
              n = 0
              for scale, amp in [(1, 0.5), (2, 0.3), (4, 0.2), (8, 0.15)]:
                  nx = int(x * scale / 8)
                  ny = int(y * scale / 4)
                  hsh = ((nx * 374761393 + ny * 668265263) ^ (nx * ny * 127)) & 0xFFFF
                  n += (hsh / 65535.0 - 0.5) * amp
              density = max(0, min(1, base * 0.85 + n * 0.4 * base))
              rr = int(180 + 40 * density)
              gg = int(185 + 40 * density)
              bb = int(220 + 25 * density)
              a = int(40 + 160 * density)
              if density > 0.6 and ((x * 17 + y * 31) & 63) < 3:
                  a = min(255, a + 60)
                  rr = min(255, rr + 30)
                  gg = min(255, gg + 30)
                  bb = min(255, bb + 20)
              return rr, gg, bb, a

          write_png(sky/'milky_way.png', 256, 64, milky)

          item = Path('src/main/resources/assets/simplespace/textures/item')
          item.mkdir(parents=True, exist_ok=True)

          configs = {
              'flash_l1': {'body': (40, 120, 200), 'accent': (120, 200, 255), 'label': (200, 220, 255)},
              'flash_l2': {'body': (30, 140, 70), 'accent': (80, 220, 120), 'label': (180, 255, 200)},
              'flash_l3': {'body': (160, 120, 30), 'accent': (255, 210, 60), 'label': (255, 240, 180)},
              'flash_l4': {'body': (120, 60, 160), 'accent': (200, 120, 255), 'label': (230, 200, 255)},
              'flash_l5': {'body': (80, 80, 90), 'accent': (180, 180, 200), 'label': (220, 220, 230)},
          }
          for name, c in configs.items():
              br, bg, bb = c['body']
              ar, ag, ab = c['accent']
              lr, lg, lb = c['label']
              def make(x, y, w, h, br=br, bg=bg, bb=bb, ar=ar, ag=ag, ab=ab, lr=lr, lg=lg, lb=lb):
                  if 5 <= x <= 10 and 0 <= y <= 3:
                      shade = 0.85 + 0.15 * ((x + y) % 2)
                      if y == 3 and x in (6, 7, 8, 9):
                          return int(60*shade), int(60*shade), int(70*shade), 255
                      return int(190*shade), int(190*shade), int(200*shade), 255
                  if 3 <= x <= 12 and 4 <= y <= 14:
                      if x == 3 or x == 12:
                          return int(br*0.5), int(bg*0.5), int(bb*0.5), 255
                      if y == 7:
                          return ar, ag, ab, 255
                      if 5 <= x <= 10 and 9 <= y <= 12:
                          return lr, lg, lb, 255
                      n = 1.0 if (x * 3 + y * 5) % 4 else 0.9
                      return int(br*n), int(bg*n), int(bb*n), 255
                  if 4 <= x <= 11 and y == 15:
                      return int(br*0.4), int(bg*0.4), int(bb*0.4), 255
                  return 0, 0, 0, 0
              write_png(item / f'{name}.png', 16, 16, make)

          def core(x, y, w, h):
              if 4 <= x <= 11 and 1 <= y <= 14:
                  if x in (4, 11) or y in (1, 14):
                      return 200, 170, 60, 255
                  shade = 0.25 + 0.1 * ((x + y) % 3)
                  if x == 6:
                      shade += 0.15
                  if x in (7, 8) and 4 <= y <= 11:
                      return 180, 150, 40, 255
                  c = int(25 + 40 * shade)
                  return c, c, int(c * 1.1), 255
              return 0, 0, 0, 0
          write_png(item / 'tars_core.png', 16, 16, core)

          def manual(x, y, w, h):
              if 2 <= x <= 13 and 1 <= y <= 14:
                  if x in (2, 13) or y in (1, 14):
                      return 90, 70, 40, 255
                  if 4 <= x <= 11 and 3 <= y <= 5:
                      return 200, 170, 60, 255
                  return 140, 110, 70, 255
              return 0, 0, 0, 0
          write_png(item / 'tars_manual.png', 16, 16, manual)

          print('all textures ok')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: simplespace-mod
          path: build/libs/*.jar
