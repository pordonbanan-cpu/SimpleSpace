name: Build Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack sources
        run: |
          unzip -o "SimpleSpace-mod-source (1).zip"
          if [ -d SimpleSpace ]; then
            cp -r SimpleSpace/* .
            cp -r SimpleSpace/.[!.]* . 2>/dev/null || true
          fi
          chmod +x gradlew || true

      - name: Apply all fixes
        run: |
          cp fixes/SpacePhysicsHandler.java src/main/java/com/simplespace/event/
          cp fixes/SpacePlanetSpawner.java src/main/java/com/simplespace/event/
          cp fixes/SpaceTransitionHandler.java src/main/java/com/simplespace/event/
          cp fixes/ModDimensions.java src/main/java/com/simplespace/dimension/
          cp fixes/CelestialBodyRenderer.java src/main/java/com/simplespace/client/
          cp fixes/SpaceDimensionEffects.java src/main/java/com/simplespace/client/
          cp fixes/ModEntities.java src/main/java/com/simplespace/entity/
          cp fixes/SimpleSpace.java src/main/java/com/simplespace/
          cp fixes/SpaceCommands.java src/main/java/com/simplespace/command/
          cp fixes/space.json src/main/resources/data/simplespace/dimension_type/
          mkdir -p src/main/resources/data/simplespace/dimension_type
          mkdir -p src/main/resources/data/simplespace/dimension
          mkdir -p src/main/resources/data/simplespace/worldgen/biome
          cp fixes/moon_type.json src/main/resources/data/simplespace/dimension_type/moon.json
          cp fixes/moon_dim.json src/main/resources/data/simplespace/dimension/moon.json
          cp fixes/moon_wastes.json src/main/resources/data/simplespace/worldgen/biome/moon_wastes.json

      - name: Generate circular textures
        run: |
          python3 << 'PY'
          from pathlib import Path
          import struct, zlib, math

          def write_png(path, w, h, rgba_func):
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  for x in range(w):
                      r,g,b,a = rgba_func(x, y, w, h)
                      raw += bytes([r,g,b,a])
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)
              data = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(bytes(raw), 9)) + chunk(b'IEND', b'')
              Path(path).write_bytes(data)

          out = Path('src/main/resources/assets/simplespace/textures/entity')
          out.mkdir(parents=True, exist_ok=True)
          SIZE = 128

          def disc_mask(x, y, w, h):
              cx, cy = (w-1)/2, (h-1)/2
              d = math.sqrt((x-cx)**2 + (y-cy)**2) / (w/2)
              if d > 1.0: return None
              edge = max(0, min(1, (1.0 - d) * 8))
              return d, edge

          def sun(x,y,w,h):
              m = disc_mask(x,y,w,h)
              if m is None: return 0,0,0,0
              d, edge = m
              heat = max(0, 1-d*0.9)
              return 255, int(200+55*heat), int(60+80*heat), int(255*edge)

          def earth(x,y,w,h):
              m = disc_mask(x,y,w,h)
              if m is None: return 0,0,0,0
              d, edge = m
              shade = 0.55 + 0.45 * max(0, 1-d)
              v = y/h
              hsh = ((x*13) ^ (y*7) ^ ((x//6)*(y//6)*19)) & 255
              if v < 0.15 or v > 0.85: r,g,b = 230,230,245
              elif hsh > 145: r,g,b = 50+hsh//10, 110+hsh//8, 45
              else: r,g,b = 25, 70+hsh//12, 170+hsh//10
              return int(r*shade), int(g*shade), int(b*shade), int(255*edge)

          def moon(x,y,w,h):
              m = disc_mask(x,y,w,h)
              if m is None: return 0,0,0,0
              d, edge = m
              shade = 0.5 + 0.5 * max(0, 1-d)
              hsh = ((x*11) ^ (y*13) ^ ((x//5)*(y//5)*23)) & 255
              base = 130 + (hsh % 50)
              if hsh > 220: base = 80
              c = int(base * shade)
              return c, c, min(255,c+12), int(255*edge)

          write_png(out/'sun.png', SIZE, SIZE, sun)
          write_png(out/'earth.png', SIZE, SIZE, earth)
          write_png(out/'moon.png', SIZE, SIZE, moon)
          print('textures ok')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: simplespace-mod
          path: build/libs/*.jar
