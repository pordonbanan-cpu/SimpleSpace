name: Build Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack sources
        run: |
          unzip -o "SimpleSpace-mod-source (1).zip"
          if [ -d SimpleSpace ]; then
            cp -r SimpleSpace/* .
            cp -r SimpleSpace/.[!.]* . 2>/dev/null || true
          fi
          chmod +x gradlew || true

      - name: Fix SpaceDimensionEffects for 1.21.1
        run: |
          cat > src/main/java/com/simplespace/client/SpaceDimensionEffects.java << 'EOF'
          package com.simplespace.client;

          import net.minecraft.client.renderer.DimensionSpecialEffects;
          import net.minecraft.world.phys.Vec3;

          public class SpaceDimensionEffects extends DimensionSpecialEffects {

              public SpaceDimensionEffects() {
                  super(Float.NaN, false, SkyType.NONE, false, false);
              }

              @Override
              public Vec3 getBrightnessDependentFogColor(Vec3 fogColor, float brightness) {
                  return new Vec3(0.0, 0.0, 0.0);
              }

              @Override
              public boolean isFoggyAt(int x, int y) {
                  return false;
              }
          }
          EOF

      - name: Fix dimension_type JSON
        run: |
          cat > src/main/resources/data/simplespace/dimension_type/space.json << 'EOF'
          {
            "ultrawarm": false,
            "natural": false,
            "coordinate_scale": 1.0,
            "has_skylight": true,
            "has_ceiling": false,
            "ambient_light": 0.0,
            "fixed_time": 18000,
            "monster_spawn_light_level": {
              "type": "minecraft:uniform",
              "min_inclusive": 0,
              "max_inclusive": 7
            },
            "monster_spawn_block_light_limit": 0,
            "piglin_safe": false,
            "bed_works": false,
            "respawn_anchor_works": false,
            "has_raids": false,
            "logical_height": 384,
            "min_y": -64,
            "height": 384,
            "infiniburn": "#minecraft:infiniburn_overworld",
            "effects": "simplespace:space"
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: simplespace-mod
          path: |
            build/libs/*.jar
            SimpleSpace/build/libs/*.jar
